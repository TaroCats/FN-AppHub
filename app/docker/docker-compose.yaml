name: apphub

services:
  apphub:
    # 镜像由 GitHub Actions 构建并推送到 GHCR，安装/升级只做拉取，不在设备上现场打包。
    # tag 由 CI 在发布时改写为 manifest 里的版本号，写死版本可避免依赖运行环境变量。
    image: ghcr.io/tarocats/apphub:1.0.29
    container_name: apphub
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      APPHUB_PORT: "9080"
      APPHUB_DATA: /app/data
      APPHUB_STATIC: /app/static
      APPHUB_PROBE_TIMEOUT: "2.5"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/apps/apphub/shares/apphub/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      options:
        max-size: 10m
        max-file: "3"
