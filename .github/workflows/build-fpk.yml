name: Build FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号递增方式（none 表示沿用 manifest 中的版本）'
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]

concurrency:
  group: build-fpk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  FNPACK_VERSION: '1.2.3'
  FNPACK_URL: 'https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64'
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  IMAGE_REPO: ghcr.io/tarocats/apphub

jobs:
  build:
    name: 打包并校验
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定并同步版本号
        id: ver
        env:
          BUMP: ${{ github.event.inputs.bump || 'none' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib

          bump = os.environ.get('BUMP', 'none') or 'none'
          manifest = pathlib.Path('manifest')
          text = manifest.read_text(encoding='utf-8')
          m = re.search(r'(?m)^version\s*=\s*(\S+)\s*$', text)
          if not m:
              raise SystemExit('manifest 中未找到 version 字段')
          current = m.group(1)
          new = current

          if bump != 'none':
              parts = [int(x) for x in re.split(r'[.\-+]', current)[:3] if x.isdigit()]
              while len(parts) < 3:
                  parts.append(0)
              if bump == 'major':
                  parts = [parts[0] + 1, 0, 0]
              elif bump == 'minor':
                  parts = [parts[0], parts[1] + 1, 0]
              else:
                  parts = [parts[0], parts[1], parts[2] + 1]
              new = '.'.join(str(p) for p in parts)
              text = re.sub(r'(?m)^version\s*=.*$', 'version               = ' + new, text)
              manifest.write_text(text, encoding='utf-8')

          # compose 中的镜像 tag 与 manifest 版本保持一致（镜像指向 GHCR，不在设备上构建）
          compose = pathlib.Path('app/docker/docker-compose.yaml')
          ctext = compose.read_text(encoding='utf-8')
          ctext = re.sub(
              r'(?m)^(\s*image:\s*ghcr\.io/[^:\s]+:).*$',
              r'\g<1>' + new,
              ctext,
          )
          compose.write_text(ctext, encoding='utf-8')

          pathlib.Path('.version').write_text(new, encoding='utf-8')
          pathlib.Path('app/docker/VERSION').write_text(new + '\n', encoding='utf-8')
          print('version=' + new)
          PY
          VERSION="$(cat .version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号：${VERSION}"

      - name: 初始化 buildx
        if: env.IS_RELEASE == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像到 GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app/docker
          file: app/docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 校验镜像可被匿名拉取
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          # 安装端不做 docker login，镜像包必须公开可拉，否则装机时会报
          # `pull access denied ... may require 'docker login'`。
          # 这里用「无凭据」的 token 探测，能拉到才算通过。
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          if ! curl -fsS "https://ghcr.io/token?scope=repository:tarocats/apphub:pull&service=ghcr.io" \
                -o /tmp/ghcr-token.json; then
            echo "::error::无法获取 GHCR 匿名 token，检查仓库可见性"
            exit 1
          fi
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/ghcr-token.json'))['token'])")
          if ! curl -fsS -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
                "https://ghcr.io/v2/tarocats/apphub/manifests/${VERSION}" -o /tmp/manifest.json; then
            echo "::error::镜像 ghcr.io/tarocats/apphub:${VERSION} 无法匿名拉取。"
            echo "请到 GitHub → Packages → apphub → Package settings，把可见性改为 Public 后重跑。"
            exit 1
          fi
          echo "镜像 ${IMAGE_REPO}:${VERSION} 可匿名拉取"

      - name: 安装 fnpack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          # 优先使用仓库内置的官方二进制（官方源 static2.fnnas.com 在海外 runner 上不可达）
          if [ -f tools/fnpack-linux-amd64 ]; then
            cp tools/fnpack-linux-amd64 "$RUNNER_TEMP/bin/fnpack"
            echo "使用仓库内置 fnpack：$(md5sum "$RUNNER_TEMP/bin/fnpack" | awk '{print $1}')"
          else
            for i in 1 2 3; do
              if curl -fsSL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/bin/fnpack" "$FNPACK_URL"; then
                break
              fi
              echo "下载 fnpack 失败，第 $i 次重试..."
              sleep 5
            done
          fi
          chmod +x "$RUNNER_TEMP/bin/fnpack"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # 注意：不要直接 `fnpack --help | head -3`，pipefail 下 head 提前关闭管道会让脚本以 141 退出
          if ! "$RUNNER_TEMP/bin/fnpack" --help > "$RUNNER_TEMP/fnpack-help.txt" 2>&1; then
            echo "fnpack 无法执行，输出如下："
            cat "$RUNNER_TEMP/fnpack-help.txt" || true
            exit 1
          fi
          head -3 "$RUNNER_TEMP/fnpack-help.txt"

      - name: 打包 FPK
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          fnpack build
          ls -l ./*.fpk
          mkdir -p dist
          mv ./*.fpk "dist/apphub_${VERSION}.fpk"
          SIZE=$(stat -c '%s' "dist/apphub_${VERSION}.fpk")
          SHA=$(sha256sum "dist/apphub_${VERSION}.fpk" | awk '{print $1}')
          echo "FPK 大小：${SIZE} 字节"
          echo "SHA256：${SHA}"

      - name: 校验 FPK 内容
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          TMP=$(mktemp -d)
          tar -xf "dist/apphub_${VERSION}.fpk" -C "$TMP"
          test -f "$TMP/manifest"
          grep -q "^appname" "$TMP/manifest"
          grep -q "version *= *${VERSION}" "$TMP/manifest"
          echo "包内 manifest 校验通过："
          grep -E '^(appname|version|platform)' "$TMP/manifest"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apphub-fpk-${{ steps.ver.outputs.version }}
          path: dist/*.fpk
          if-no-files-found: error

      - name: 更新 fndepot 源索引 fnpack.json
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          python3 scripts/gen_fnpack.py \
            --version "$VERSION" \
            --fpk "dist/apphub_${VERSION}.fpk" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/apphub_${VERSION}.fpk"
          python3 -m json.tool fnpack.json > /dev/null
          echo "fnpack.json 已更新："
          cat fnpack.json

      - name: 提交版本号与源索引并回写 main
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest app/docker/VERSION app/docker/docker-compose.yaml fnpack.json
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "chore(release): AppHub ${VERSION} [skip ci]"
          fi
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
            echo "已回写 main：$(git rev-parse --short HEAD)"
          else
            echo "当前提交不在 main 上，跳过回写（请手动同步 manifest / fnpack.json）"
          fi

      - name: 创建或更新 Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          TAG="v${VERSION}"
          python3 scripts/gen_fnpack.py --version "$VERSION" --changelog-out dist/notes.md || true
          if [ ! -s dist/notes.md ]; then
            echo "AppHub ${VERSION}" > dist/notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/apphub_${VERSION}.fpk" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            gh release create "$TAG" \
              --title "AppHub ${VERSION}" \
              --notes-file dist/notes.md \
              "dist/apphub_${VERSION}.fpk"
          fi
          gh release view "$TAG" --json url,assets --jq '.url'
